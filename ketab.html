<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتاب مانو</title>
<style>
body{font-family:Tahoma;background:#0f0f0f;color:#fff;text-align:center;padding:50px}
.box{background:#1e1e1e;padding:30px;border-radius:15px;max-width:500px;margin:auto}
input{padding:12px;width:80%;border-radius:8px;border:none;margin:10px 0;text-align:center;font-size:18px;letter-spacing:2px}
button{padding:12px 25px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px}
#book{display:none;margin-top:20px}
.error{color:#ff4444;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>🔓 افتح كتابك</h2>
<p>دخل الكود الخاص بيك اللي البوت بعتهولك</p>
<input id="codeInput" placeholder="MANO-XXXXXXXX">
<br>
<button onclick="checkCode()">فتح الكتاب</button>
<p id="msg" class="error"></p>

<div id="book">
<h3 style="color:#00ff88">مبروك يا بطل! ✅</h3>
<p>ده لينك الكتاب بتاعك:</p>
<a href="https://drive.google.com/file/d/18iZ0v3XWPVxGbxJ4g7M3p2xX..." target="_blank" style="color:#00ff88;font-size:20px">📘 اضغط هنا لتحميل الكتاب</a>
<p style="margin-top:15px;font-size:14px;color:#aaa">الكود ده صالح ليك انت بس</p>
</div>
</div>

<script>
function isValidCode(code){
  // يقبل MANO- + 8 حروف وارقام كابيتال
  let pattern = /^MANO-[A-Z0-9]{8}$/;
  return pattern.test(code.trim().toUpperCase());
}

function checkCode(){
  let code = document.getElementById('codeInput').value.trim().toUpperCase();
  let msg = document.getElementById('msg');
  let book = document.getElementById('book');
  
  if(isValidCode(code)){
    msg.innerText = "";
    book.style.display = "block";
  } else {
    msg.innerText = "الكود غلط! لازم يكون شكله MANO- + 8 حروف وارقام";
    book.style.display = "none";
  }
}

// لو جاي من لينك البوت ?code=MANO-XXXXXXXX يفتح اوتوماتيك
window.onload = function(){
  let params = new URLSearchParams(window.location.search);
  let codeFromLink = params.get('code');
  if(codeFromLink){
    document.getElementById('codeInput').value = codeFromLink;
    checkCode();
  }
}
</script>
</body>
</html>
